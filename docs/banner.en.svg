<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="desk-core — managed context for AI agents: rules that arrive right on time">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="24" fill="#1c1c1e"/>
  <rect width="1200" height="320" rx="24" fill="url(#dots)"/>

  <!-- rule card -->
  <g transform="translate(84 66)">
    <rect x="0" y="0" width="168" height="190" rx="12" fill="#232326" stroke="#34343a"/>
    <rect x="0.5" y="0.5" width="167" height="189" rx="11.5" fill="none" stroke="#0a84ff" stroke-opacity="0.35"/>
    <g font-family="SFMono-Regular, ui-monospace, Menlo, JetBrains Mono, Consolas, monospace" font-size="14">
      <text x="18" y="34" fill="#7c7c82">---</text>
      <text x="18" y="56" fill="#0a84ff">when:</text>
      <text x="30" y="76" fill="#f5f5f7">git: write</text>
      <text x="18" y="98" fill="#0a84ff">guard:</text>
      <text x="30" y="118" fill="#f5f5f7">deny …</text>
      <text x="18" y="140" fill="#7c7c82">---</text>
    </g>
    <rect x="18" y="154" width="104" height="6" rx="3" fill="#34343a"/>
    <rect x="18" y="168" width="72" height="6" rx="3" fill="#34343a"/>
  </g>

  <!-- arrow: the rule arrives at the action -->
  <g fill="none" stroke="#0a84ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M280 160 H 330"/>
    <path d="M318 148 L 332 160 L 318 172"/>
  </g>

  <!-- brand mark, title and slogan -->
  <rect x="362" y="66" width="64" height="64" rx="16" fill="#0a84ff"/>
  <text x="394" y="106" text-anchor="middle" font-family="SFMono-Regular, ui-monospace, Menlo, JetBrains Mono, Consolas, monospace" font-size="24" font-weight="700" fill="#ffffff">&lt;/&gt;</text>
  <text x="446" y="122" font-family="SFMono-Regular, ui-monospace, Menlo, JetBrains Mono, Consolas, monospace" font-size="64" font-weight="700" fill="#f5f5f7" letter-spacing="-1">desk<tspan fill="#7c7c82">-core</tspan></text>
  <text x="364" y="178" font-family="-apple-system, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#f5f5f7">Managed context for AI agents</text>
  <text x="364" y="212" font-family="SFMono-Regular, ui-monospace, Menlo, JetBrains Mono, Consolas, monospace" font-size="19" fill="#a1a1a6"><tspan fill="#0a84ff">›</tspan> rules that arrive right on time</text>

  <!-- chips -->
  <g font-family="SFMono-Regular, ui-monospace, Menlo, JetBrains Mono, Consolas, monospace" font-size="16">
    <rect x="364" y="236" width="180" height="34" rx="6" fill="#0a84ff" fill-opacity="0.14" stroke="#0a84ff" stroke-opacity="0.35"/><text x="377" y="258" fill="#0a84ff">when: git commit</text>
    <rect x="556" y="236" width="189" height="34" rx="6" fill="#ff453a" fill-opacity="0.12" stroke="#ff453a" stroke-opacity="0.4"/><text x="569" y="258" fill="#ff453a">guard: deny / ask</text>
    <rect x="757" y="236" width="199" height="34" rx="6" fill="#30d158" fill-opacity="0.12" stroke="#30d158" stroke-opacity="0.4"/><text x="770" y="258" fill="#30d158">measure: reached ✓</text>
  </g>
</svg>
