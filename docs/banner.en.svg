<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="desk-core — rules for Claude Code that arrive right on time">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1b2540"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>

  <!-- rule cards -->
  <g transform="translate(88 70)">
    <rect x="28" y="28" width="150" height="186" rx="14" fill="#1e293b" stroke="#334155"/>
    <rect x="14" y="14" width="150" height="186" rx="14" fill="#1f2a44" stroke="#3b4a6b"/>
    <rect x="0" y="0" width="150" height="186" rx="14" fill="#111a2e" stroke="url(#accent)" stroke-width="2.5"/>
    <text x="18" y="34" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#64748b">---</text>
    <text x="18" y="56" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#2dd4bf">when:</text>
    <text x="30" y="76" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#cbd5e1">git: write</text>
    <text x="18" y="98" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#818cf8">guard:</text>
    <text x="30" y="118" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#cbd5e1">deny …</text>
    <text x="18" y="140" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#64748b">---</text>
    <rect x="18" y="154" width="96" height="6" rx="3" fill="#334155"/>
    <rect x="18" y="168" width="70" height="6" rx="3" fill="#334155"/>
  </g>

  <!-- arrow: rule arrives at the action -->
  <g fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round">
    <path d="M262 160 C 300 160, 300 160, 330 160"/>
    <path d="M320 150 L332 160 L320 170"/>
  </g>

  <!-- title -->
  <text x="360" y="150" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="78" font-weight="700" fill="#e2e8f0" letter-spacing="-1">desk<tspan fill="url(#accent)">-core</tspan></text>
  <text x="362" y="196" font-family="-apple-system, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="28" fill="#94a3b8">rules for Claude Code that arrive right on time</text>

  <!-- chips -->
  <g font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">
    <rect x="362" y="226" width="180" height="34" rx="17" fill="#0f172a" stroke="#2dd4bf" stroke-opacity="0.7"/><text x="375" y="248" fill="#2dd4bf">when: git commit</text>
    <rect x="554" y="226" width="189" height="34" rx="17" fill="#0f172a" stroke="#818cf8" stroke-opacity="0.7"/><text x="567" y="248" fill="#818cf8">guard: deny / ask</text>
    <rect x="755" y="226" width="199" height="34" rx="17" fill="#0f172a" stroke="#fbbf24" stroke-opacity="0.7"/><text x="768" y="248" fill="#fbbf24">measure: reached ✓</text>
  </g>
</svg>
