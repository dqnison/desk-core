[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "desk-core"
version = "0.2.0"
description = "Managed context for AI agents: rules for Claude Code that arrive right on time, guards before a call runs, and a measure of whether rules reached the model."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []
keywords = ["claude-code", "hooks", "rules", "context-engineering", "agents"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Topic :: Software Development",
]

[project.urls]
Homepage = "https://deskcore.pages.dev"
Repository = "https://github.com/dqnison/desk-core"

[project.scripts]
desk = "desk.cli:main"
desk-hook = "desk.hook:main"

[tool.setuptools]
packages = ["desk"]
include-package-data = true

[tool.setuptools.package-data]
desk = ["template/**/*", "template/**/.*", "template/.gitignore"]
